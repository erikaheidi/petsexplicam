# carrossel - imagens da Pretinha e do Paçoca como militantes, base para os
# posts em carrossel feitos no Canva.
#
# DUAS ETAPAS (a receita do foto-perfil):
#   1. Placas (text-to-image), 4:5 (1024x1280, o formato do carrossel do
#      Instagram): compram a composição, com uma buldogue preta genérica no
#      lugar da Pretinha. O terço de cima fica livre para o texto do Canva.
#        ./mm images movies/carrossel/scripts/v1.yaml
#   2. Edição da placa escolhida: placa = <image1>, foto da Josy = <image2>,
#      para a Pretinha ganhar as marcas reais (o modo edição dimensiona a
#      partir de image_1, então o 4:5 se mantém).
#
# Bandeira: vermelha com estrela AMARELA no centro é a bandeira do Vietnã. A
# passeata sai nas duas versões (estrela amarela e branca) para a Erika escolher.
#
# Qwen-Image-2.1 tem licença de pesquisa (uso NÃO comercial): não use estas
# imagens se o perfil for monetizado.
kind: images
name: carrossel

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  width: 1024
  height: 1280
  style_suffix: >-
    Live-action photograph, not an illustration, not a cartoon, not a render.
    Real fur texture, sharp focus on the two main dogs, natural colours. No
    text, no letters, no numbers, no logos and no watermark anywhere in the
    picture.

images:
  # --- bandanas vermelhas, pata levantada ----------------------------------
  - id: bandana-a
    seed: 4101
    prompt: &bandana >-
      A vertical photograph of two dogs sitting side by side like proud
      activists, against a plain, evenly lit warm off-white seamless
      backdrop. The camera is at the dogs' eye level, straight on. The dogs
      fill the lower two thirds of the frame, seen from their paws to the
      tips of their ears; the upper third is empty backdrop.

      ON THE LEFT: a small female French bulldog, compact and muscular, with
      a short black coat with faint darker brindle striping, a white blaze on
      the centre of her chest, large upright bat ears, round dark brown eyes
      and a short wrinkled muzzle. ON THE RIGHT: a male pug, stocky and
      round, with a short fawn-yellow coat, a jet-black mask over his muzzle
      and around his eyes, small black folded ears, large round glossy dark
      eyes, deep forehead wrinkles and a tightly curled tail.

      Each dog wears a plain bright red cotton bandana tied around the neck,
      with no pattern and no print. Each dog raises one front paw high in the
      air, like a raised-fist salute at a rally. The French bulldog looks
      straight into the lens, serious and determined, mouth closed; the pug
      looks into the lens with an excited, proud open-mouthed grin.
  - id: bandana-b
    seed: 4102
    prompt: *bandana

  # --- passeata: estrela amarela (pedido) ----------------------------------
  - id: passeata-amarela-a
    seed: 4201
    prompt: &passeata-amarela >-
      A vertical photograph of a joyful street march of pets in a Brazilian
      city street on a sunny afternoon, seen from the dogs' eye level. In the
      front, in the centre and in sharp focus, two dogs lead the march side
      by side, walking towards the camera: ON THE LEFT a small female French
      bulldog, compact and muscular, with a short black coat with faint
      darker brindle striping, a white blaze on the centre of her chest,
      large upright bat ears, round dark brown eyes and a short wrinkled
      muzzle; ON THE RIGHT a male pug, stocky and round, with a short
      fawn-yellow coat, a jet-black mask over his muzzle and around his eyes,
      small black folded ears, large round glossy dark eyes and deep forehead
      wrinkles. Both wear plain bright red bandanas around their necks.

      Behind them, softly out of focus, a crowd of many other dogs and cats
      of all breeds and sizes march along, all wearing red accessories - red
      bandanas, small red caps, red scarves. Above the crowd wave many red
      flags on short poles, each plain red with a single five-pointed yellow
      star in the centre and nothing else on it. Colourful two-storey
      buildings line the street. No humans appear anywhere. The upper third
      of the picture is sky and waving flags, with room for text.
  - id: passeata-amarela-b
    seed: 4202
    prompt: *passeata-amarela

  # --- passeata: estrela branca (estilo PT, sem o Vietnã) -------------------
