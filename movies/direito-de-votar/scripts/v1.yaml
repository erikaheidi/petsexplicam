      [Shot 1] The shot opens on the composition of <Picture 1>. The camera is completely static on a tripod at table height, facing the table straight on in a medium shot, close enough that the dogs fill the upper half of the frame, and it never moves, pans or zooms. The near edge of the square wooden dining table with the white crocheted tablecloth runs along the bottom of the frame. <Subject 1> sits upright on a wooden chair behind the table, just left of centre, her head and chest large in the frame, a plain black laptop with a matte black lid open on the tablecloth in front of her with its lid facing the camera, so its screen is never visible. A second wooden chair stands behind the table just right of centre, beside hers. Close behind them, softly out of focus, is the bright turquoise wall of <Subject 3> with the open green shutter window on the left. <Subject 2> stands on the seat of the second wooden chair just right of centre, beside her, with his front paws resting on the edge of the table, so his head is level with hers. <Subject 1> sits up tall the whole time with her chin above the top of the laptop lid, so her whole face and mouth stay visible; she never sinks down behind the laptop. Neither dog speaks. <Subject 2>'s ears droop, his forehead wrinkles deepen, and his head sinks slowly until his chin rests on the edge of the table between his front paws. His big glossy eyes look up at <Subject 1> with a crushed, disappointed expression, and he lets out one long, deflated sigh through his nose. <Subject 1> types calmly on the laptop. Both stay completely still for the last second. Each dog's mouth moves only while that dog speaks. No humans appear at any point, and no text, lettering, watermark, letterboxing or black bars appear anywhere in the frame.
      overall_soundscape: Quiet indoor room tone, with faint neighbourhood ambience drifting in through the open shutters: distant voices, birdsong and a far-off motorbike. No barking, whining or growling at any point.
