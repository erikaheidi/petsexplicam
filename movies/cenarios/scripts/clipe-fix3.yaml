    seed: 10401
    ref_images: [cenario-rua-bairro.png, renato-referencia.png]
    prompt: >-
      A photograph on the same tidy residential street of a middle-class
      Brazilian neighbourhood as in <image1>: single-storey houses in soft
      colours with low front walls, iron gates and small front gardens, trees
      along the sidewalk, a blooming yellow ipê tree, and strings of small
      green, yellow and a few red paper bunting flags across the street, on a
      sunny Sunday morning, taken from a static camera at the dog's eye level,
      in a medium-wide shot. In the middle of the frame is the English bulldog
      from <image2>, with the same massive wrinkled face, heavy jowls, white
      coat with fawn-brindle patches over his ears and eyes, and greying muzzle,
      dressed all in white: a plain white short-sleeved button-up shirt with a
      collar, his front legs through the sleeves, and no collar. He stands just
      outside the closed front door of his cream house, on the short path to his
      gate, straightening the collar of his shirt with one front paw, about to
      walk out. His whole body, face and mouth are clearly visible; he keeps
      exactly the same face, coat and markings as in <image2>. No people
      anywhere in the picture. Use <image1> only as a reference for the look of
      the neighbourhood: none of the dogs in <image1> appear. This dog is
      completely alone in the picture: no French bulldog, no pug, no poodle, no
      cocker spaniel, no caramel dog and no other dog anywhere, not behind
      walls, gates or windows.
