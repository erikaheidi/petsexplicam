# clipe - o videoclipe de domingo, 25/10 ("Andar com Fé", Gilberto Gil, sem
# fala; no fim, os 7 cantam o refrão). Cada personagem sai de casa no mesmo
# bairro arrumado da rua-bairro, todos de BRANCO, acenando para os vizinhos;
# depois um close bonito de cada um; no fim, os 7 se encontram na rua.
# Ordem (Erika): Lurdes, Tião, Cida, José, Renato, Paçoca, Pretinha.
# <image1> = a rua aprovada (cenario-rua-bairro.png), só como referência do
# bairro; <image2> = a referência do personagem.
#
#   ./mm images movies/cenarios/scripts/clipe.yaml
kind: images
name: clipe

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, bright, soft Sunday-morning sunlight, vibrant but natural colours,
      vertical 9:16 framing. No text, no letters, no numbers, no logos, no
      flags of any party, no banners and no signs with anything written on
      them anywhere in the picture.

