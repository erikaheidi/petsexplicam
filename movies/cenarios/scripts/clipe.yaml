    seed: 10101
    ref_images: [cenario-rua-bairro.png, lurdes-referencia.png]
    prompt: >-
      A photograph on the same tidy residential street of a middle-class
      Brazilian neighbourhood as in <image1>: single-storey houses in soft
      colours with low front walls, iron gates and small front gardens, trees
      along the sidewalk, a blooming yellow ipê tree, and strings of small
      green, yellow and a few red paper bunting flags across the street, on a
      sunny Sunday morning, taken from a static camera at the dog's eye level,
      in a medium-wide shot. In the middle of the frame is the plump elderly
      cocker spaniel from <image2>, with the same wavy golden-red coat, white
      muzzle and long wavy ears, dressed all in white: a plain white
      hand-knitted cardigan, buttoned at the chest, her front legs through the
      sleeves, and no collar. She steps out through the open iron gate of her
      pale yellow house onto the sidewalk, one front paw lifted mid-step, and
      waves her other front paw towards a friendly neighbour dog looking over a
      low wall across the street. Her whole body, face and mouth are clearly
      visible; she keeps exactly the same face, coat and markings as in
      <image2>. No people anywhere in the picture.
