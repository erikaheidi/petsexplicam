# ponto-onibus - o ponto de ônibus da avenida no fim da tarde, na volta do
# trabalho: o Paçoca (de polo de uniforme, com o contracheque) e a Pretinha
# no banco do abrigo (contracheque-ir, refeito fora do sofá). Abrigo sem
# propaganda nem placa. 1ª ref: a Pretinha em 9:16.
# Rodada 2: closes pretinha (por cima do ombro do Paçoca) e pacoca.
#
#   ./mm images movies/cenarios/scripts/ponto-onibus.yaml --dry-run
#   ./mm images movies/cenarios/scripts/ponto-onibus.yaml
kind: images
name: ponto-onibus

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  # 25, não 8: com 8 passos uma edição se afasta da referência.
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, real fabric, golden late-afternoon light, shallow depth of
      field, vertical 9:16 framing. No text, no letters, no numbers, no logos,
      no labels, no price tags, no screens and no signs with anything written
      on them anywhere in the picture.

images:
  # Rodada 1 - o plano principal, do zero (2 seeds). A Erika escolhe.
  - id: dupla-a
    seed: 9561
    ref_images: [cenario-varandafrente-pretinha.png, pacoca-referencia.png]
    prompt: &p1 >-
      A photograph at a bus stop on a busy avenue in a Brazilian city at the
      end of the afternoon, taken from a static camera at the dogs' eye level,
      in a medium shot. Two dogs sit side by side on the metal bench of the
      bus shelter, turned towards each other as if in conversation: on the
      left, the black French bulldog in <image1> (not the fawn pug at the edge
      of that picture): the same face, the same large upright bat ears, the
      same white stripe down the middle of her muzzle, greyish-white chin, with no collar and no harness, wearing a plain red short-sleeved t-shirt with no print, no logo and no lettering, her front legs through the sleeves, seen in a
      three-quarter profile turned to the right; on the right, the fawn pug on
      the right in <image2>: the same face, black mask, small folded ears,
      deep forehead wrinkles and round body, seen in a three-quarter profile
      turned to the left. The pug wears a plain navy-blue work polo shirt with
      no logo, his front legs through the sleeves, and holds a folded sheet of
      white paper under one front paw on the bench. Both faces and both mouths
      are clearly visible. Behind them, softly out of focus: the glass back
      panel of the shelter with nothing on it, the avenue with passing cars,
      trees and low buildings in warm golden light. No advertising, no sign
      and no timetable anywhere. No people anywhere in the picture.
  - id: dupla-b
    seed: 9562
    ref_images: [cenario-varandafrente-pretinha.png, pacoca-referencia.png]
    prompt: *p1
