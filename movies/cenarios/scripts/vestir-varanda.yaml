# vestir-varanda - a Pretinha de camiseta vermelha lisa no frame do vlog da
# varanda (recado-final). Só a roupa muda.
#
#   ./mm images movies/cenarios/scripts/vestir-varanda.yaml
kind: images
name: vestir-varanda

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, real knitted wool, bright even indoor lighting, shallow depth
      of field, vertical 9:16 framing. No text, no letters, no numbers, no
      logos, no labels, no price tags, no screens and no signs with anything
      written on them anywhere in the picture.

images:
  - id: a
    seed: 10041
    ref_images: [cenario-varanda-vlog-pretinha.png]
    prompt: &v >-
      Edit the photograph <image1>. Keep everything exactly as it is - the
      veranda, the light, the framing, the black French bulldog's face, ears,
      pose and where she is looking. Change only one thing: she now wears a
      plain red short-sleeved t-shirt with no print, no logo and no lettering,
      her front legs through the sleeves, covering her chest. Her face, ears
      and head stay exactly the same.
  - id: b
    seed: 10042
    ref_images: [cenario-varanda-vlog-pretinha.png]
    prompt: *v
