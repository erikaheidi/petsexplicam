# praca - vlog do primo José num banco de praça do bairro, gravando com o
# celular apoiado (audio-falso, refeito fora do home office). Câmera única
# vlog-jose: ele olha direto para a lente. Camiseta azul-marinho lisa (no
# home office é cinza com fone). Sem rodada 2.
#
#   ./mm images movies/cenarios/scripts/praca.yaml --dry-run
#   ./mm images movies/cenarios/scripts/praca.yaml
kind: images
name: praca

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  # 25, não 8: com 8 passos uma edição se afasta da referência.
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, real fabric, warm late-afternoon sunlight through trees,
      shallow depth of field, vertical 9:16 framing. No text, no letters, no
      numbers, no logos, no labels, no price tags, no screens and no signs
      with anything written on them anywhere in the picture.

images:
  # Rodada 1 - o plano principal, do zero (2 seeds). A Erika escolhe.
  - id: vlog-jose-a
    seed: 9521
    ref_images: [jose-referencia-916.png]
    prompt: &p1 >-
      Edit the photograph <image1>: fill the whole vertical frame with a new
      scene, replacing the background. Keep the dog exactly as he is: the
      caramel mixed-breed dog in <image1>: the same face, the same short
      smooth caramel-golden coat with paler cream fur on his muzzle, throat
      and chest, the same ears that stand up at the base and fold forward at
      the tips, the same warm amber-brown eyes. He wears a plain navy-blue
      short-sleeved t-shirt with no print and no logo, his front legs through
      the sleeves, and no collar. He sits on a green-painted wooden bench in a
      small neighbourhood square in a Brazilian city at the end of the
      afternoon, facing the camera straight on and looking directly into the
      lens, as if recording a video on a phone propped up in front of him at
      his eye level; his head is in the upper half of the frame, his chest
      below it, his whole face and mouth clearly visible. Behind him, softly
      out of focus: big leafy trees, a patterned Portuguese stone pavement, a
      few flower beds, low colourful houses across the street and golden light
      through the leaves. No people anywhere in the picture.
  - id: vlog-jose-b
    seed: 9522
    ref_images: [jose-referencia-916.png]
    prompt: *p1
