# salao rodada 2 - closes por cima do ombro a partir do plano aprovado
# (trio-a -> assets/cenario-salao.png): a Pretinha de vermelho no banquinho, a
# Cida (poodle) e a Lurdes (cocker) nas cadeiras rosa sob os secadores.
# voto-depois-dos-70.
#
#   ./mm images movies/cenarios/scripts/salao-closes.yaml
kind: images
name: salao-closes

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, real knitted wool, bright even indoor lighting, shallow depth
      of field, vertical 9:16 framing. No text, no letters, no numbers, no
      logos, no labels, no price tags, no screens and no signs with anything
      written on them anywhere in the picture.

images:
  - id: pretinha-a
    seed: 10011
    ref_images: [cenario-salao.png, cenario-varandafrente-pretinha.png]
    prompt: &pretinha >-
      Change the photograph <image1> into an over-the-shoulder close-up of the
      black French bulldog, as in a film conversation. Keep her exactly as she
      is: the French bulldog from <image1>, who is also the black French bulldog
      in <image2> (not the fawn pug at the edge of that picture): the same face,
      the same large upright bat ears, the same white stripe down the middle of
      her muzzle and greyish-white chin, wearing the same plain red short-
      sleeved t-shirt with no print. The camera is just behind the white poodle
      in the lilac cardigan: in the foreground at the lower right, out of focus,
      are the poodle's curly shoulder in the lilac knitted cardigan and the back
      of her long curly ear, turned away from the camera; her face is never
      seen. The French bulldog sits on her round beige stool facing the camera
      at a three-quarter angle, turned towards the ladies and looking at them,
      at the same height, just to the right of the camera, never into the lens;
      her sharp face, whole muzzle and chest in the red t-shirt fill the left
      two thirds of the frame, her mouth closed. Behind her, softly out of
      focus, the pale pink wall, the window and the shelf with folded towels and
      the potted plant of the beauty salon, in soft daylight. No people, no
      human figures, no mirrors and no human hands anywhere in the picture.
  - id: pretinha-b
    seed: 10012
    ref_images: [cenario-salao.png, cenario-varandafrente-pretinha.png]
    prompt: *pretinha
  - id: senhoras-a
    seed: 10021
    ref_images: [cenario-salao.png, cida-referencia-3q.png, lurdes-referencia-3q.png]
    prompt: &senhoras >-
      Change the photograph <image1> into an over-the-shoulder close shot of the
      two elderly lady dogs, as in a film conversation. Keep them exactly as
      they are: the white poodle in the lilac knitted cardigan, who is also the
      poodle in <image2>, with the same off-white curly coat, greying muzzle and
      long curly ears; and the cocker spaniel in the sea-green knitted cardigan,
      who is also the cocker spaniel in <image3>, with the same wavy golden-red
      coat, white muzzle and long wavy ears. The camera is just behind the black
      French bulldog: in the foreground at the lower left, out of focus, are her
      black head, the back of her large upright bat ear and her shoulder in the
      red t-shirt, turned away from the camera; her face is never seen. The two
      ladies sit side by side on the pink salon chairs under the cream hood hair
      dryers, the poodle on the left and the cocker spaniel on the right, both
      facing the camera at a three-quarter angle, turned to the left towards the
      French bulldog and looking at her, at the same height, just to the left of
      the camera, never into the lens; their sharp faces, muzzles and chests in
      the cardigans fill the right two thirds of the frame, their mouths closed.
      Behind them, softly out of focus, the cream hood dryers and the pale pink
      wall of the beauty salon. No people, no human figures, no mirrors and no
      human hands anywhere in the picture.
  - id: senhoras-b
    seed: 10022
    ref_images: [cenario-salao.png, cida-referencia-3q.png, lurdes-referencia-3q.png]
    prompt: *senhoras
