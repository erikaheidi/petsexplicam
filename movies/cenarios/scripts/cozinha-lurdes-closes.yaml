# cozinha-lurdes rodada 2 - closes por cima do ombro a partir do plano
# aprovado (trio-a -> assets/cenario-cozinha-lurdes.png). neto-6x1.
#
#   ./mm images movies/cenarios/scripts/cozinha-lurdes-closes.yaml
kind: images
name: cozinha-lurdes-closes

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, real knitted wool, warm natural midday light from the window,
      shallow depth of field, vertical 9:16 framing. No text, no letters, no
      numbers, no logos, no labels and no signs with anything written on them
      anywhere in the picture.
images:
  - id: pretinha-a
    seed: 9911
    ref_images: [cenario-cozinha-lurdes.png, cenario-varandafrente-pretinha.png]
    prompt: &pretinha >-
      Change the photograph <image1> into an over-the-shoulder close-up of the
      black French bulldog, as in a film conversation. Keep her exactly as she
      is: the black French bulldog from <image1>, who is also the black French
      bulldog in <image2> (not the fawn pug at the edge of that picture): the
      same face, the same large upright bat ears, the same white stripe down the
      middle of her muzzle, greyish-white chin, with no collar and no harness, wearing a plain red short-sleeved t-shirt with no print, no logo and no lettering, her front legs through the sleeves. The camera is at the height of the
      table top, just behind the two elderly lady dogs: in the foreground at the
      lower right, out of focus, are the cocker spaniel's wavy golden-red
      shoulder in the sea-green knitted cardigan and the back of her long wavy
      ear, turned away from the camera; her face is never seen. The French
      bulldog sits on her wooden chair at the table facing the camera at a
      three-quarter angle, turned towards the ladies and looking at them, just
      to the right of the camera; her sharp face, whole muzzle and chest in the red t-shirt fill the left two thirds of the frame, above the red-and-
      white checked oilcloth, her mouth closed. Behind her, softly out of focus,
      the pale yellow wall tiles, the old white enamel stove with a steaming pan
      and the window with the lace curtain, in warm midday light. No people, no
      human figures and no human hands anywhere in the picture.
  - id: pretinha-b
    seed: 9912
    ref_images: [cenario-cozinha-lurdes.png, cenario-varandafrente-pretinha.png]
    prompt: *pretinha
  - id: senhoras-a
    seed: 9921
    ref_images: [cenario-cozinha-lurdes.png, lurdes-referencia-3q.png, cida-referencia-3q.png]
    prompt: &senhoras >-
      Change the photograph <image1> into an over-the-shoulder close shot of the
      two elderly lady dogs, as in a film conversation. Keep them exactly as
      they are: the cocker spaniel in the sea-green knitted cardigan, who is
      also the cocker spaniel in <image2>, with the same wavy golden-red coat,
      white muzzle and long wavy ears; and the white poodle in the lilac knitted
      cardigan, who is also the poodle in <image3>, with the same off-white
      curly coat, greying muzzle and long curly ears. The camera is at the
      height of the table top, just behind the black French bulldog: in the
      foreground at the lower left, out of focus, are her black shoulder in the red t-shirt and the
      back of her large upright black bat ear, turned away from the camera; her
      face is never seen. The two ladies sit side by side on wooden chairs at
      the table, the cocker spaniel on the left and the poodle on the right,
      both facing the camera at a three-quarter angle, turned towards the French
      bulldog and looking at her, just to the left of the camera; their sharp
      faces, muzzles and chests in the cardigans fill the right two thirds of
      the frame, above the red-and-white checked oilcloth with the pots of rice
      and beans, their mouths closed. Behind them, softly out of focus, the pale
      yellow wall tiles, a wall clock and plants on the window sill, in warm
      midday light. No people, no human figures and no human hands anywhere in
      the picture.
  - id: senhoras-b
    seed: 9922
    ref_images: [cenario-cozinha-lurdes.png, lurdes-referencia-3q.png, cida-referencia-3q.png]
    prompt: *senhoras
