# clipe-fix2 - a Pretinha de novo: com a foto real (pretinha-referencia.jpg) ela
# saiu parecida com a Josy, não com a Pretinha da série (Erika, 24/10).
# Referência agora: o frame do recado-final de corpo inteiro
# (assets/pretinha-referencia-vermelha.png), trocando a camiseta vermelha
# pela branca.
#
#   ./mm images movies/cenarios/scripts/clipe-fix2.yaml
kind: images
name: clipe-fix2

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, bright, soft Sunday-morning sunlight, vibrant but natural colours,
      vertical 9:16 framing. No text, no letters, no numbers, no logos, no
      flags of any party, no banners and no signs with anything written on
      them anywhere in the picture.

images:
  - id: pretinha-acao-a
    seed: 10301
    ref_images: [cenario-rua-bairro.png, pretinha-referencia-vermelha.png]
    prompt: >-
      A photograph on the same tidy residential street of a middle-class
      Brazilian neighbourhood as in <image1>: single-storey houses in soft
      colours with low front walls, iron gates and small front gardens, trees
      along the sidewalk, a blooming yellow ipê tree, and strings of small
      green, yellow and a few red paper bunting flags across the street, on a
      sunny Sunday morning, taken from a static camera at the dog's eye level,
      in a medium-wide shot. In the middle of the frame is the black French
      bulldog from <image2>, with exactly the same face as in <image2>: her
      whole coat is solid black with faint dark brindle, her four legs and paws
      are black, and the only white on her is a small blaze in the middle of her
      chest; the same large upright bat ears and the same face, dressed in a
      plain white short-sleeved t-shirt (white, not the red one she wears in
      <image2>) with no print that covers only her chest and back, her black
      legs and black paws clearly visible below it, her front legs through the
      sleeves, and no collar. She walks calmly along the sidewalk towards the
      camera, mid-stride, her head high, serene and determined. Her whole body,
      face and mouth are clearly visible; she keeps exactly the same face, coat
      and markings as in <image2>. No people anywhere in the picture. Her legs,
      paws, belly and head are black, never white.
