# loterica rodada 3 - a Erika escolheu dentro-a (loterica-2.yaml), mas os três
# não se olham: a Pretinha olha para o alto e a poodle quase para a câmera.
# olhar-*: só os olhares corrigidos. pretinha-*/senhoras-*: closes por cima do
# ombro, a partir de dentro-a mesmo, para não esperar a escolha do olhar.
#
#   ./mm images movies/cenarios/scripts/loterica-3.yaml
kind: images
name: loterica-3

comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: qwen_image_2.1_bf16.safetensors
  text_encoder: qwen3vl_8b_bf16.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple

defaults:
  resolution: 1024
  style_suffix: >-
      The result is a real photograph, not an illustration, cartoon or render:
      real fur, real knitted wool, bright even indoor lighting, shallow depth
      of field, vertical 9:16 framing. No text, no letters, no numbers, no
      logos, no labels, no price tags, no screens and no signs with anything
      written on them anywhere in the picture.

images:
  - id: olhar-a
    seed: 9801
    ref_images: [loterica-dentro-a.png]
    prompt: &olhar >-
      Edit the photograph <image1>. Keep everything exactly as it is - the
      lottery shop with the blue and orange service windows, the chairs, the
      floor, the dogs in the queue, the three dogs' faces, coats, cardigans,
      the brown handbag and their positions - and change only where the three
      dogs in front are looking, so that they are clearly talking to each
      other. The black French bulldog on the left turns her head to the right
      and a little up, and looks straight at the white poodle's face, her
      gaze level with the poodle's eyes; her face is in three-quarter profile
      towards the right of the frame. The white poodle in the lilac cardigan
      turns her head to the left and tilts it down, and looks at the French
      bulldog's face; her muzzle points down to the lower left, towards the
      bulldog, not at the camera. The cocker spaniel in the green cardigan
      also turns her head to the left and down, and looks at the French
      bulldog. None of the three looks at the camera; their mouths are
      closed and their faces are clearly visible.
  - id: olhar-b
    seed: 9802
    ref_images: [loterica-dentro-a.png]
    prompt: *olhar

  - id: pretinha-a
    seed: 9811
    ref_images: [loterica-dentro-a.png, cenario-varandafrente-pretinha.png]
    prompt: &pretinha >-
      Change the photograph <image1> into an over-the-shoulder close-up of the
      black French bulldog, as in a film conversation. Keep her exactly as she
      is: the French bulldog from <image1>, who is also the black French
      bulldog in <image2> (not the fawn pug at the edge of that picture): the
      same face, the same large upright bat ears, the same white stripe down
      the middle of her muzzle, greyish-white chin and wide white blaze on her
      chest, with no collar and no harness. The camera is low, just behind the
      two elderly lady dogs on their chairs: in the foreground at the lower
      right, out of focus, are the white poodle's curly shoulder in the lilac
      knitted cardigan and the back of her long curly ear, turned away from
      the camera; her face is never seen. The French bulldog sits on the pale
      floor tiles facing the camera at a three-quarter angle, turned towards
      the ladies and looking up at them, just to the right of the camera; her
      sharp face, whole muzzle and chest with the white blaze fill the left
      two thirds of the frame, her mouth closed. Behind her, softly out of
      focus, the blue and orange wall of the lottery shop and the end of the
      counter with its glass service window, under bright white ceiling
      lights. No people, no human figures and no human hands anywhere in the
      picture.
  - id: pretinha-b
    seed: 9812
    ref_images: [loterica-dentro-a.png, cenario-varandafrente-pretinha.png]
    prompt: *pretinha

  - id: senhoras-a
    seed: 9821
    ref_images: [loterica-dentro-a.png, cida-referencia-3q.png, lurdes-referencia-3q.png]
    prompt: &senhoras >-
      Change the photograph <image1> into an over-the-shoulder close shot of
      the two elderly lady dogs, as in a film conversation. Keep them exactly
      as they are: the white poodle in the lilac knitted cardigan with the
      small brown leather handbag on her lap, who is also the poodle in
      <image2>, with the same off-white curly coat, greying muzzle and long
      curly ears; and the cocker spaniel in the sea-green knitted cardigan,
      who is also the cocker spaniel in <image3>, with the same wavy
      golden-red coat, white muzzle and long wavy ears. The camera is low,
      just behind the black French bulldog: in the foreground at the lower
      left, out of focus, are her black shoulder and the back of her large
      upright black bat ear, turned away from the camera; her face is never
      seen. The two ladies sit side by side on the beige plastic waiting
      chairs, the poodle on the left and the cocker spaniel on the right,
      both facing the camera at a three-quarter angle, turned towards the
      French bulldog and looking down at her, just to the left of the camera;
      their sharp faces, muzzles and chests in the cardigans fill the right
      two thirds of the frame, their mouths closed. Behind them, softly out
      of focus, the blue and orange service windows of the lottery shop with
      their thick glass and round metal speaking grilles, under bright white
      ceiling lights. No people, no human figures and no human hands anywhere
      in the picture.
  - id: senhoras-b
    seed: 9822
    ref_images: [loterica-dentro-a.png, cida-referencia-3q.png, lurdes-referencia-3q.png]
    prompt: *senhoras
