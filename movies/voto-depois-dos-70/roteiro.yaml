# voto-depois-dos-70 - no salão, a Lurdes e a Cida contam que a amiga delas,
# Dona Zuleide (80, não aparece), disse que não vai votar. A Pretinha confirma
# que depois dos setenta o voto não é obrigatório, mas o voto dela vale igual,
# e tira as desculpas: prioridade na fila (60+) e ônibus de graça (65+). As
# duas decidem buscar a amiga. Falas aprovadas pela Erika em 22/10.
# Ver drafts/voto-depois-dos-70.md.
#
# Continuidade: a Cida e a Lurdes JÁ vão votar (no 13 - aposentadoria-subiu,
# neto-6x1); quem resiste é a Zuleide. Nenhum candidato citado.
# Fatos: CF art. 14 §1º II b (facultativo para maiores de 70); Estatuto da
# Pessoa Idosa (prioridade 60+); CF art. 230 §2º (transporte coletivo urbano
# gratuito para maiores de 65). NÃO usar "ônibus de graça no domingo".
#
# Cenário salao: a Pretinha de vermelho no banquinho à esquerda, a Cida
# (poodle) no meio e a Lurdes (cocker) à direita, nas cadeiras sob os secadores.
cenario: salao
seed: 2026

cenas:
  - id: zuleide
    camera: dupla
    resumo: Lurdes tells Cida that their friend Zuleide will not vote.
    antes: Lurdes turns her head a little towards Cida, worried.
    fala:
      quem: lurdes
      texto: "Cida, a Zuleide falou que não vai votar domingo."

  - id: oitenta
    resumo: Cida explains Zuleide's reason.
    antes: Cida tilts her head, a little doubtful.
    fala:
      quem: cida
      texto: "Diz que com oitenta anos não é obrigada."

  - id: facultativo
    resumo: Pretinha confirms, polite.
    antes: Pretinha keeps looking at the two ladies, polite and calm.
    fala:
      quem: pretinha
      texto: "É verdade: depois dos setenta, o voto não é obrigatório."

  - id: vale-igual
    resumo: Pretinha makes her point, warm.
    antes: Pretinha's eyes soften.
    fala:
      quem: pretinha
      texto: "Mas o voto dela vale igualzinho ao de todo mundo."

  - id: fila
    resumo: Lurdes lists Zuleide's excuses.
    antes: Lurdes lets out a small sigh.
    fala:
      quem: lurdes
      texto: "Ela reclama da fila. E da escola, que é longe."

  - id: prioridade
    resumo: Pretinha answers the first excuse.
    antes: Pretinha nods slowly.
    fala:
      quem: pretinha
      texto: "Quem tem mais de sessenta tem prioridade na fila."

  - id: onibus
    resumo: Pretinha answers the second excuse.
    antes: Pretinha keeps looking at the ladies, calm.
    fala:
      quem: pretinha
      texto: "E acima de sessenta e cinco, o ônibus é de graça."

  - id: se-ficar
    resumo: Cida asks what happens if Zuleide stays home.
    antes: Cida leans in a little towards Pretinha.
    fala:
      quem: cida
      texto: "E se ela ficar em casa, minha filha?"

  - id: netos
    resumo: Pretinha answers, serious.
    antes: Pretinha keeps looking at Cida, serious and warm.
    fala:
      quem: pretinha
      texto: "Aí quem decide o futuro dos netos dela é outra pessoa."

  - id: buscar
    resumo: Cida decides they will fetch Zuleide, smiling.
    antes: Cida lifts her muzzle, her eyes bright, and smiles.
    fala:
      quem: cida
      texto: "Domingo a gente passa lá e vai as três juntas!"
      tom: cheerful and decided

  - id: fecho
    camera: dupla
    resumo: Pretinha closes, and the two ladies nod.
    antes: Pretinha keeps looking at the two ladies, then nods firmly.
    fala:
      quem: pretinha
      texto: "Isso. Ninguém fica pra trás. Dia vinte e cinco!"
    depois: Cida and Lurdes nod together, smiling.
