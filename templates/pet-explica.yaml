# template: Pet explica - um pet falando com a câmera em PT-BR, cenas independentes (comfy, ref2va)
# default: true
#
# O formato base do @petsexplicam: um pet encara a câmera e explica alguma
# coisa, com fala em português do Brasil. Cada cena é independente
# (chain_from_previous: false, sem anchors) - dá para renderizar, refazer e
# reordenar cenas sem invalidar as outras.
#
# REFERÊNCIA DO PET: coloque a foto em assets/ (compartilhado, se o pet aparece
# em vários filmes) ou em movies/__project__/assets/ (só este filme) e troque
# pet-referencia.jpg abaixo. O script não carrega enquanto o arquivo não existir.
# <Picture N> segue a ordem de ref_images da cena.
#
# IDIOMA: o prompt H3 é escrito em INGLÊS (é o que o modelo entende melhor e o
# que o skill h3-prompt-writing exige). Só a fala fica em PT-BR, literal, dentro
# de <d>[Portuguese] ...</d>. Texto visível na tela também fica em PT-BR, entre
# aspas duplas.
#
# TEMPO: video_frames precisa estar na grade 17n+5. 107 = 4,46 s a 24 fps - cabe
# uma frase curta (~10-12 palavras). Fala mais longa = mais cenas, não cena maior.
name: CHANGE-ME
backend: comfy
comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: minimax_h3_fastvideo_vsa_datafree_1300step_4step_int8_convrot.safetensors
  text_encoder: qwen3vl_32b_minimax_h3_bf16.safetensors
  video_vae: minimax_h3_video_vae_int8_convrot.safetensors
  audio_vae: minimax_h3_audio_vae_fp32.safetensors
  # 8 passos com start_percent 0.2 / end_percent 1.0 - a config estável do
  # josy-gamer v6 e do josy-hangover-dream. Com 4 passos e a atenção esparsa
  # ligada desde o primeiro passo a câmera TREME (medido com vidstabdetect:
  # ~0,6-1,8 px/frame de tremor vertical contra ~0,02 nesta config). Os primeiros
  # 20% em atenção densa fixam a estrutura global, câmera inclusive.
  steps: 8
  # `match` mantém as refs no tamanho do canvas: refs em tamanho cheio custam ~3x.
  ref_image_size: match
  sol_attn:
    mode: vsa
    keep_percent: 20.0
    min_tokens: 4096     # o default 12288 do node é um crossover de CUDA
    start_percent: 0.2
    end_percent: 1.0
    verbose: true        # sem isso, toda falha deste node é silenciosa
defaults:
  # 9:16 vertical - o formato de Reels.
  width: 544
  height: 960
  fps: 24
  video_frames: 107
  seed: 2024
  style_suffix: ""
continuity:
  anchors: []
  chain_from_previous: false
output:
  container: mp4
  audio: keep
  music: null
scenes:
  - id: abertura
    ref_images: [pet-referencia.jpg]
    prompt: |-
      subject_definitions:
      <Subject 1> is THE PET in <Picture 1>: species, breed, size, coat colour and markings, ears, eyes, muzzle - concrete, countable detail. Say whether it wears a collar.
      <Subject 2> is THE SETTING: describe the place in concrete, countable detail.
      summary:
      [reference generation] The target video is one continuous shot of <Subject 1> in <Subject 2>, looking straight into the lens and explaining something to the viewer. <Picture 1> supplies <Subject 1> and nothing else.
      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - its build, coat, markings and face are retained from the first frame to the last.
      <Picture 1> (subject reference for <Subject 1>): partially_preserved - only the animal itself is taken from it. Its background, lighting and framing do not appear.
      detailed_description:
      The target video is photorealistic live-action footage, shot on a medium lens from a static camera at the animal's eye level. SAY THE LIGHT AND THE FRAMING ABSOLUTELY.
      [Shot 1] <Subject 1> (S1) sits facing the camera, whole head and chest in frame, and says in A VOICE DESCRIBED IN WORDS (age, pitch, timbre, pace, attitude): <d>[Portuguese] A FALA, LITERAL, EM PORTUGUÊS DO BRASIL.</d> Its mouth moves in sync with the words and closes when the line ends. No humans appear at any point, and no text, lettering, watermark, letterboxing or black bars appear anywhere in the frame.
      overall_soundscape: THE ROOM TONE, and the close sounds the animal makes. No barking, meowing, whining or panting over the line.
      non_diegetic_music: THE STYLE. Entirely instrumental, with no singer and no vocals, kept low under the speech at one unchanging tempo.
