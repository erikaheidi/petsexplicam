# template: Pet explica encadeado - um plano contínuo em várias cenas, anchors + overlap (comfy, ref2va)
#
# Um filme contínuo: cada cena depois da primeira abre na cauda da anterior
# (overlap_frames), com vídeo E som, e a foto do pet vai como anchor em todas
# as cenas para segurar a identidade. Use quando a explicação é longa demais
# para uma cena só e precisa parecer um único take.
#
# CUIDADO COM O DRIFT DE CÂMERA: um movimento de câmera liberado alarga todas
# as cenas seguintes, e um re-render herda o enquadramento errado. Descreva o
# enquadramento de forma absoluta em todas as cenas.
#
# No comfy o encadeamento é um anchor de overlap, não uma referência: ele não
# ocupa índice, então <Picture 1> é sempre o primeiro anchor, em toda cena.
#
# IDIOMA: prompt em inglês; só a fala em PT-BR, literal, em <d>[Portuguese] ...</d>.
name: CHANGE-ME
backend: comfy
comfy:
  url: http://127.0.0.1:8188
  input_dir: /home/erika/Projects/rocm-comfyui/data/input
  output_dir: /home/erika/Projects/rocm-comfyui/data/output
  diffusion_model: minimax_h3_fastvideo_vsa_datafree_1300step_4step_int8_convrot.safetensors
  text_encoder: qwen3vl_32b_minimax_h3_bf16.safetensors
  video_vae: minimax_h3_video_vae_int8_convrot.safetensors
  audio_vae: minimax_h3_audio_vae_fp32.safetensors
  # 8 passos com start_percent 0.2 / end_percent 1.0 - a config estável do
  # josy-gamer v6 e do josy-hangover-dream. Com 4 passos e a atenção esparsa
  # ligada desde o primeiro passo a câmera TREME (medido com vidstabdetect:
  # ~0,6-1,8 px/frame de tremor vertical contra ~0,02 nesta config). Os primeiros
  # 20% em atenção densa fixam a estrutura global, câmera inclusive.
  steps: 8
  ref_image_size: match
  sol_attn:
    mode: vsa
    keep_percent: 20.0
    min_tokens: 4096
    start_percent: 0.2
    end_percent: 1.0
    verbose: true
defaults:
  width: 544
  height: 960
  fps: 24
  video_frames: 107
  seed: 8821
  style_suffix: ""
  overlap_frames: 5
continuity:
  # <Picture 1>, <Picture 2> ... nesta ordem, em todas as cenas.
  anchors:
    - pet-referencia.jpg
  chain_from_previous: true
output:
  container: mp4
  audio: keep
scenes:
  - id: abertura
    chain_from_previous: false
    prompt: |-
      subject_definitions:
      <Subject 1> is THE PET in <Picture 1>: species, breed, coat and markings in concrete detail.
      summary:
      [reference generation] SCENE 1: <Subject 1> faces the camera and starts explaining.
      detailed_description:
      [Shot 1] Static camera at the animal's eye level; say the framing absolutely. <Subject 1> (S1), in A VOICE DESCRIBED IN WORDS, says: <d>[Portuguese] PRIMEIRA FALA.</d>
      overall_soundscape: THE ROOM TONE. No barking or meowing over the line.
      non_diegetic_music: THE STYLE, instrumental, low under the speech, one unchanging tempo.
  - id: continuacao
    prompt: |-
      subject_definitions:
      <Subject 1> is THE PET in <Picture 1>: the same description as scene 1.
      summary:
      [reference generation] SCENE 2 continues directly from the end of scene 1.
      detailed_description:
      [Shot 1] Same framing as scene 1 - do not widen. <Subject 1> (S1), in the same voice, says: <d>[Portuguese] SEGUNDA FALA.</d>
      overall_soundscape: THE ROOM TONE, unchanged.
      non_diegetic_music: THE SAME music, continuing.
